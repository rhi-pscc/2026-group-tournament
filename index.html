// ============================ group-tournament engine ============================
// Model: every Expert in the roster captains one Group. Every other player
// (Intermediate/Novice) is dealt into a group. Per group: Intermediate players pair
// into lettered teams (A, B, C…); Novice players — one partners the group's Expert
// as a Mixed team, the rest pair into Novice team(s). Every match is cross-group
// only: round-robin per category-key across every group that has that category.
// (Verified with a standalone randomized test harness: 500 fuzzed roster shapes,
// expert counts 1–6, court counts 1–8 — zero scheduling conflicts, and the exact
// Aug 21 roster reproduces the hand-built workbook's 15 matches / 6-round-minimum
// result exactly.)

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dealRoundRobin(items, n) {
  const buckets = Array.from({ length: n }, () => []);
  items.forEach((item, i) => buckets[i % n].push(item));
  return buckets;
}

// roster: [{id, name, rank}]. Returns freshly-shuffled `groups` state:
// [{ id, label, captainId, teams: [{ id, key, category, letter, label, groupId, p1Id, p2Id }] }]
function autoAssignGroups(roster) {
  const experts = roster.filter((p) => p.rank === "Expert");
  const intermediates = roster.filter((p) => p.rank === "Intermediate");
  const novices = roster.filter((p) => p.rank === "Novice");
  const n = experts.length;
  if (n === 0) return [];

  const orderedExperts = shuffleArr(experts);
  const intPools = dealRoundRobin(shuffleArr(intermediates), n);
  const novPools = dealRoundRobin(shuffleArr(novices), n);

  return orderedExperts.map((captain, i) => {
    const groupId = `g${i + 1}`;
    const teams = [];
    const ints = intPools[i];
    for (let k = 0, li = 0; k < ints.length; k += 2, li++) {
      teams.push({
        id: `${groupId}_int_${li}`, key: `Intermediate-${LETTERS[li]}`, category: "Intermediate",
        letter: LETTERS[li], label: `Intermediate Team ${LETTERS[li]}`, groupId,
        p1Id: ints[k].id, p2Id: ints[k + 1] ? ints[k + 1].id : null,
      });
    }
    const novs = novPools[i];
    const mixedPartner = novs[0] || null;
    teams.push({
      id: `${groupId}_mixed`, key: "Mixed", category: "Mixed", label: "Mixed (Expert+Novice) Team", groupId,
      p1Id: captain.id, p2Id: mixedPartner ? mixedPartner.id : null,
    });
    const remainingNovs = novs.slice(1);
    const multiNovice = remainingNovs.length > 2;
    for (let k = 0, ln = 0; k < remainingNovs.length; k += 2, ln++) {
      teams.push({
        id: `${groupId}_nov_${ln}`, key: multiNovice ? `Novice-${LETTERS[ln]}` : "Novice", category: "Novice",
        label: multiNovice ? `Novice Team ${LETTERS[ln]}` : "Novice Team", groupId,
        p1Id: remainingNovs[k].id, p2Id: remainingNovs[k + 1] ? remainingNovs[k + 1].id : null,
      });
    }
    return { id: groupId, label: `Group ${i + 1}`, captainId: captain.id, teams };
  });
}

function rosterMap(roster) {
  const m = {};
  roster.forEach((p) => { m[p.id] = p; });
  return m;
}

function playerName(pid, byId) {
  if (!pid) return "BYE PARTNER";
  const p = byId[pid];
  return p ? p.name : "(removed player)";
}

function teamLabelFromIds(t, byId) {
  return `${playerName(t.p1Id, byId)} & ${playerName(t.p2Id, byId)}`;
}

// "Group 1 — Ashwin" style label so people can tell groups apart by captain,
// not just a number. Computed from live captainId (not baked into g.label at
// shuffle time) so it stays correct if admin reassigns the captain later.
function groupLabelWithCaptain(g, byId) {
  return `${g.label} — ${playerName(g.captainId, byId)}`;
}

// ---- small helpers shared by the Fun Stats tab and the PDF export ----
function sideLabel(team, byId) {
  return team.category === "Singles" ? playerName(team.p1Id, byId) : teamLabelFromIds(team, byId);
}
function winnerSide(h) { return h.r.winnerGroupId === h.m.groupA.id ? h.m.teamA : h.m.teamB; }
function loserSide(h) { return h.r.winnerGroupId === h.m.groupA.id ? h.m.teamB : h.m.teamA; }
function scoreLine(h) {
  const hi = Math.max(h.r.scoreA, h.r.scoreB), lo = Math.min(h.r.scoreA, h.r.scoreB);
  return `${hi}-${lo}`;
}

// Builds every cross-group match (round-robin per category key across groups that
// have it) plus Expert Singles round-robin among captains. Ties are allowed here
// (unlike a single-elimination bracket) — a tied score just means "Tie · replay",
// worth 0 points to either group, matching the source workbook's rule exactly.
function buildMatches(groups, byId) {
  const byKey = {};
  groups.forEach((g) => {
    g.teams.forEach((t) => { (byKey[t.key] = byKey[t.key] || []).push({ group: g, team: t }); });
  });
  byKey["Singles"] = groups.map((g) => ({ group: g, team: { id: `${g.id}_singles`, key: "Singles", category: "Singles", label: "Expert Singles", groupId: g.id, p1Id: g.captainId, p2Id: null } }));

  const order = ["Mixed", "Intermediate-A", "Intermediate-B", "Intermediate-C", "Intermediate-D", "Novice", "Novice-A", "Novice-B", "Novice-C", "Singles"];
  const keys = Object.keys(byKey).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });

  const matches = [];
  keys.forEach((key) => {
    const entries = byKey[key];
    if (entries.length < 2) return;
    for (let i = 0; i < entries.length; i++) {
      for (let j = i + 1; j < entries.length; j++) {
        const A = entries[i], B = entries[j];
        const label = A.team.category === "Singles"
          ? `Expert: ${A.group.label} vs ${B.group.label}`
          : `${A.team.category}: ${A.group.label} vs ${B.group.label}`;
        matches.push({
          id: `${key}__${A.group.id}_${B.group.id}`, key, category: A.team.category, label,
          groupA: A.group, teamA: A.team, groupB: B.group, teamB: B.team,
        });
      }
    }
  });
  return matches;
}

// Greedy round scheduler: a round holds up to `courtCount` matches; a match may
// join a round only if neither expert it needs (Mixed/Singles only) nor either of
// its two teams is already committed elsewhere in that round. This is what
// automatically enforces the "only 1 Expert-match at a time per pair of Experts"
// rule from the source workbook — it falls out of the token bookkeeping rather
// than being special-cased, so it generalizes to any number of Experts/groups.
function scheduleMatches(matches, courtCount) {
  const remaining = [...matches];
  const rounds = [];
  const teamToken = (t) => (t.p2Id === null && t.category === "Singles" ? `S:${t.p1Id}` : `T:${t.groupId}:${t.key}`);
  const expertTokens = (m) => (m.category === "Mixed" || m.category === "Singles")
    ? [`E:${m.groupA.captainId}`, `E:${m.groupB.captainId}`] : [];

  while (remaining.length > 0) {
    const used = new Set();
    const round = [];
    for (let i = 0; i < remaining.length && round.length < Math.max(1, courtCount); i++) {
      const m = remaining[i];
      const toks = [...expertTokens(m), teamToken(m.teamA), teamToken(m.teamB)];
      if (toks.some((t) => used.has(t))) continue;
      toks.forEach((t) => used.add(t));
      round.push(m);
    }
    if (round.length === 0) break; // shouldn't happen — safety valve against an infinite loop
    round.forEach((m) => { remaining.splice(remaining.indexOf(m), 1); });
    rounds.push(round);
  }
  return rounds;
}

function emptyRoster() {
  return [];
}

function GroupTournamentApp() {
  const [eventName, setEventName] = useState("RHI-PSCC Group Tournament · Aug 21");
  const [roster, setRoster] = useState(emptyRoster());
  const [groups, setGroups] = useState([]); // [] until first shuffle
  const [matchScores, setMatchScores] = useState({});
  const [courtOverrides, setCourtOverrides] = useState({});
  const [courtCount, setCourtCount] = useState(DEFAULT_COURT_COUNT);
  const [minutesPerMatch, setMinutesPerMatch] = useState(DEFAULT_MINUTES);

  const [tab, setTab] = useState("roster");
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState("");
  const [isAdmin, setIsAdmin] = useState(false);
  const [pinOpen, setPinOpen] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [unlocking, setUnlocking] = useState(false);
  const [findQuery, setFindQuery] = useState("");
  const [syncState, setSyncState] = useState("connecting");
  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkText, setBulkText] = useState("");
  const [expandedGroupIds, setExpandedGroupIds] = useState(() => new Set());

  const editingRoster = useRef(false);
  const nextIdRef = useRef(1);
  const newPlayerId = () => `p${Date.now()}_${nextIdRef.current++}`;

  // Same per-field-per-id race guard as the doubles-bracket app: a remote
  // Firestore snapshot can echo back a version of the doc that predates a write
  // still in flight (typing two match scores within the same second, etc).
  // Without this, that stale echo would overwrite what was just typed.
  const pendingEdits = useRef({ matchScores: {}, courtOverrides: {} });
  const markPending = (field, id) => { const m = pendingEdits.current[field]; m[id] = (m[id] || 0) + 1; };
  const clearPending = (field, id) => { const m = pendingEdits.current[field]; const n = (m[id] || 1) - 1; if (n <= 0) delete m[id]; else m[id] = n; };
  const mergeGuarded = (field, remoteMap, localMap) => {
    const pending = pendingEdits.current[field];
    const merged = { ...remoteMap };
    Object.keys(pending).forEach((id) => { if (pending[id] && localMap[id] !== undefined) merged[id] = localMap[id]; });
    return merged;
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  const applyRemoteData = (data) => {
    if (!data) return;
    if (typeof data.eventName === "string") setEventName(data.eventName);
    if (data.roster && !editingRoster.current) setRoster(data.roster);
    if (data.groups) setGroups(data.groups);
    if (data.matchScores) setMatchScores((prev) => mergeGuarded("matchScores", data.matchScores, prev));
    if (data.courtOverrides) setCourtOverrides((prev) => mergeGuarded("courtOverrides", data.courtOverrides, prev));
    if (typeof data.courtCount === "number") setCourtCount(data.courtCount);
    if (typeof data.minutesPerMatch === "number") setMinutesPerMatch(data.minutesPerMatch);
  };

  useEffect(() => {
    if (!firebaseReady) { setLoaded(true); setSyncState("error"); return; }
    const unsubAuth = auth.onAuthStateChanged((user) => setIsAdmin(!!user));
    const unsub = getDocRef().onSnapshot(
      (snap) => { if (snap.exists) applyRemoteData(snap.data()); setLoaded(true); setSyncState("live"); },
      (err) => { console.error("Firestore listen error", err); setLoaded(true); setSyncState("error"); }
    );
    return () => { unsub && unsub(); unsubAuth && unsubAuth(); };
  }, []);

  const patch = async (obj) => {
    if (!firebaseReady) { showToast("Not connected — changes won't be saved"); return; }
    try { await getDocRef().set(obj, { merge: true }); }
    catch (e) { console.error("save failed", e); showToast("Sync error — check connection"); }
  };

  const tryUnlock = async () => {
    if (!firebaseReady) { showToast("Not connected — try again in a moment"); return; }
    setUnlocking(true);
    try {
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pinInput);
      setPinOpen(false); setPinInput(""); showToast("Admin mode unlocked");
    } catch (e) { showToast("Wrong password"); setPinInput(""); }
    finally { setUnlocking(false); }
  };
  const lockAdmin = () => { auth.signOut(); showToast("Switched to view-only"); };

  const byId = useMemo(() => rosterMap(roster), [roster]);

  // ---- roster editing ----
  const addPlayer = (name, rank) => {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    const next = [...roster, { id: newPlayerId(), name: trimmed, rank: rank || "Intermediate" }];
    setRoster(next); patch({ roster: next });
  };
  const updatePlayer = (id, fields) => {
    const next = roster.map((p) => (p.id === id ? { ...p, ...fields } : p));
    setRoster(next); patch({ roster: next });
  };
  const removePlayer = (id) => {
    const next = roster.filter((p) => p.id !== id);
    setRoster(next); patch({ roster: next });
  };
  const applyBulkRoster = () => {
    // "Name, Rank" or "Name - Rank" per line; rank defaults to Intermediate if omitted/unrecognized.
    const lines = bulkText.split(/\n/).map((l) => l.trim()).filter(Boolean);
    const added = lines.map((line) => {
      const parts = line.split(/\s*,\s*/);
      const name = (parts[0] || "").trim();
      const rankGuess = (parts[1] || "").trim().toLowerCase();
      const rank = rankGuess.startsWith("exp") ? "Expert" : rankGuess.startsWith("nov") ? "Novice" : rankGuess.startsWith("int") ? "Intermediate" : "Intermediate";
      return name ? { id: newPlayerId(), name, rank } : null;
    }).filter(Boolean);
    if (added.length === 0) { showToast("Nothing to add"); return; }
    const next = [...roster, ...added];
    setRoster(next); patch({ roster: next });
    setBulkOpen(false); setBulkText("");
    showToast(`Added ${added.length} player${added.length === 1 ? "" : "s"}`);
  };

  const rosterCounts = useMemo(() => {
    const c = { Expert: 0, Intermediate: 0, Novice: 0 };
    roster.forEach((p) => { c[p.rank] = (c[p.rank] || 0) + 1; });
    return c;
  }, [roster]);

  // ---- roster self-audit (mirrors the workbook's "Novice Roster Check") ----
  const assignmentAudit = useMemo(() => {
    // Captains are intentionally NOT counted here on top of their team slots — a
    // group's captain always also appears as the Mixed team's p1Id (that's the
    // same person, not a second assignment), so counting both would flag every
    // captain as "assigned twice" even on a perfectly clean shuffle.
    const seen = {};
    groups.forEach((g) => {
      g.teams.forEach((t) => {
        if (t.p1Id) seen[t.p1Id] = (seen[t.p1Id] || 0) + 1;
        if (t.p2Id) seen[t.p2Id] = (seen[t.p2Id] || 0) + 1;
      });
    });
    const unassigned = roster.filter((p) => !seen[p.id]);
    const doubled = roster.filter((p) => seen[p.id] > 1);
    const expertsNotCaptaining = roster.filter((p) => p.rank === "Expert" && !groups.some((g) => g.captainId === p.id));
    return { unassigned, doubled, expertsNotCaptaining, stale: groups.length > 0 && roster.filter((p) => p.rank === "Expert").length !== groups.length };
  }, [roster, groups]);

  // ---- shuffle / rebuild groups ----
  const shuffleGroups = () => {
    if (rosterCounts.Expert < 1) { showToast("Add at least 1 Expert to captain a group first"); return; }
    const hasRecordedScores = Object.values(matchScores).some((s) => s && typeof s === "object" && (s.a !== null || s.b !== null));
    if (groups.length > 0 && hasRecordedScores) {
      const ok = window.confirm("Reshuffling erases the current groups, schedule, and every recorded score — there's no undo. Export a PDF first (Standings tab) if you want to keep a record of this tournament. Reshuffle anyway?");
      if (!ok) return;
    }
    const next = autoAssignGroups(roster);
    setGroups(next);
    setMatchScores({}); setCourtOverrides({});
    patch({ groups: next, matchScores: {}, courtOverrides: {} });
    setTab("groups");
    showToast("Groups shuffled");
  };

  // ---- move-a-player editing (admin dropdowns on the Groups tab) ----
  const setTeamSlot = (groupId, teamId, slot, playerId) => {
    const next = groups.map((g) => g.id !== groupId ? g : {
      ...g,
      teams: g.teams.map((t) => t.id !== teamId ? t : { ...t, [slot]: playerId || null }),
    });
    setGroups(next); patch({ groups: next });
  };
  // Keeps the Mixed team's p1Id (which is *displayed* from the team object, not
  // re-derived from captainId) in lockstep with the captain change — otherwise
  // the Mixed team card would keep showing the outgoing captain's name.
  const setCaptain = (groupId, playerId) => {
    const next = groups.map((g) => g.id !== groupId ? g : {
      ...g,
      captainId: playerId,
      teams: g.teams.map((t) => (t.key === "Mixed" ? { ...t, p1Id: playerId } : t)),
    });
    setGroups(next); patch({ groups: next });
  };

  // ---- derived: matches, schedule, standings ----
  const matches = useMemo(() => buildMatches(groups, byId), [groups, byId]);
  const rounds = useMemo(() => scheduleMatches(matches, courtCount), [matches, courtCount]);

  const isValidScorePair = (s) => s && typeof s === "object" && Number.isFinite(s.a) && Number.isFinite(s.b);
  const matchResult = (m) => {
    const s = matchScores[m.id];
    if (!isValidScorePair(s)) return { status: "pending" };
    if (s.a === s.b) return { status: "tie", scoreA: s.a, scoreB: s.b };
    return { status: "done", winnerGroupId: s.a > s.b ? m.groupA.id : m.groupB.id, scoreA: s.a, scoreB: s.b };
  };

  // Point differential (sum of "own score minus opponent score" across every
  // match a group has played) is the tiebreaker when two groups are level on
  // points — same idea as net rating/goal difference in other sports. It's
  // the secondary sort key below, and it's what decides a champion when the
  // top of the table is tied on points.
  const standings = useMemo(() => {
    const points = {}; const played = {}; const diff = {};
    groups.forEach((g) => { points[g.id] = 0; played[g.id] = 0; diff[g.id] = 0; });
    matches.forEach((m) => {
      const r = matchResult(m);
      if (r.status === "pending") return;
      played[m.groupA.id] = (played[m.groupA.id] || 0) + 1;
      played[m.groupB.id] = (played[m.groupB.id] || 0) + 1;
      diff[m.groupA.id] = (diff[m.groupA.id] || 0) + (r.scoreA - r.scoreB);
      diff[m.groupB.id] = (diff[m.groupB.id] || 0) + (r.scoreB - r.scoreA);
      if (r.status === "done") points[r.winnerGroupId] = (points[r.winnerGroupId] || 0) + 1;
    });
    const rows = groups.map((g) => ({ group: g, points: points[g.id] || 0, played: played[g.id] || 0, diff: diff[g.id] || 0, total: matches.filter((m) => m.groupA.id === g.id || m.groupB.id === g.id).length }));
    return rows.sort((a, b) => b.points - a.points || b.diff - a.diff);
  }, [groups, matches, matchScores]);

  const champion = useMemo(() => {
    if (standings.length === 0) return null;
    const allDone = matches.every((m) => matchResult(m).status !== "pending");
    if (!allDone || matches.length === 0) return null;
    const top = standings[0];
    const leaders = standings.filter((s) => s.points === top.points && s.diff === top.diff);
    return leaders.length === 1 ? leaders[0].group : { tie: leaders.map((l) => l.group) };
  }, [standings, matches, matchScores]);

  // ---- personal "fun stats" (bar-talk material) ----
  // A doubles pairing is fixed for the whole tournament, so a player's
  // personal record is just every match their team(s) played — a captain
  // gets two streams merged: their Mixed-team results AND their personal
  // Singles results, exactly like a real person would recount their day.
  const playerStats = useMemo(() => {
    const stats = {};
    const ensure = (pid) => (stats[pid] = stats[pid] || { wins: 0, losses: 0, ties: 0, played: 0, pf: 0, pa: 0 });
    const credit = (pid, own, opp, status, won) => {
      const s = ensure(pid);
      s.played++; s.pf += own; s.pa += opp;
      if (status === "tie") s.ties++; else if (won) s.wins++; else s.losses++;
    };
    matches.forEach((m) => {
      const r = matchResult(m);
      if (r.status === "pending") return;
      [m.teamA.p1Id, m.teamA.p2Id].filter(Boolean).forEach((pid) => credit(pid, r.scoreA, r.scoreB, r.status, r.status === "done" && r.winnerGroupId === m.groupA.id));
      [m.teamB.p1Id, m.teamB.p2Id].filter(Boolean).forEach((pid) => credit(pid, r.scoreB, r.scoreA, r.status, r.status === "done" && r.winnerGroupId === m.groupB.id));
    });
    return roster.map((p) => {
      const s = stats[p.id] || { wins: 0, losses: 0, ties: 0, played: 0, pf: 0, pa: 0 };
      return { player: p, ...s, diff: s.pf - s.pa, winPct: s.played > 0 ? s.wins / s.played : 0 };
    });
  }, [matches, matchScores, roster]);

  const matchHighlights = useMemo(() => {
    const decided = matches.map((m) => ({ m, r: matchResult(m) })).filter(({ r }) => r.status === "done");
    if (decided.length === 0) return null;
    const withMargin = decided.map((h) => ({ ...h, margin: Math.abs(h.r.scoreA - h.r.scoreB) }));
    const blowout = withMargin.reduce((a, b) => (b.margin > a.margin ? b : a));
    const nailbiter = withMargin.reduce((a, b) => (b.margin < a.margin ? b : a));
    return { blowout, nailbiter };
  }, [matches, matchScores]);

  // ---- export a point-in-time PDF record (standings/groups/full match log/fun
  // stats) — mainly so a reshuffle (which wipes scores) doesn't erase the only
  // record of how a tournament actually went. ----
  const exportPdf = () => {
    if (!window.jspdf || !window.jspdf.jsPDF) { showToast("PDF library still loading — try again in a moment"); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const marginX = 44;
    const pageH = doc.internal.pageSize.getHeight();
    const pageW = doc.internal.pageSize.getWidth();
    const contentW = pageW - marginX * 2;
    // same palette as the live site (see the "Design tokens" comment near the top)
    const C = { teal: [15, 82, 87], tealDark: [9, 51, 55], lime: [196, 217, 59], charcoal: [22, 33, 31], chalk: [247, 245, 238], muted: [108, 122, 118], line: [228, 224, 210], loss: [180, 72, 58], white: [255, 255, 255] };
    let y = 0;
    let pageNum = 1;

    const footer = () => {
      doc.setDrawColor(...C.line); doc.setLineWidth(0.75);
      doc.line(marginX, pageH - 34, pageW - marginX, pageH - 34);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...C.muted);
      doc.text((eventName || "RHI-PSCC Group Tournament").toUpperCase(), marginX, pageH - 22);
      doc.text(`Page ${pageNum}`, pageW - marginX, pageH - 22, { align: "right" });
    };
    const newPage = () => {
      footer();
      doc.addPage();
      pageNum++;
      doc.setFillColor(...C.teal);
      doc.rect(0, 0, pageW, 5, "F");
      y = 46;
    };
    const ensureRoom = (needed) => { if (y + needed > pageH - 46) newPage(); };

    // Section header: a light chip with a lime accent bar, teal caps text —
    // mirrors the colored chips used throughout the live app.
    const sectionHeading = (text) => {
      ensureRoom(30);
      doc.setFillColor(...C.chalk);
      doc.roundedRect(marginX, y - 15, contentW, 24, 4, 4, "F");
      doc.setFillColor(...C.lime);
      doc.rect(marginX, y - 15, 4, 24, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...C.tealDark);
      doc.text(text.toUpperCase(), marginX + 14, y + 1);
      y += 28;
    };
    const subLine = (text, size = 9.5, color = C.muted) => {
      ensureRoom(size + 6);
      doc.setFont("helvetica", "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      doc.text(text, marginX, y);
      y += size + 5;
    };
    // Small bordered stat cards, 2 per row — used for the Fun Stats highlights.
    const statCards = (cards) => {
      const cols = 2, gap = 10, cardH = 46;
      const cardW = (contentW - gap) / cols;
      ensureRoom(Math.ceil(cards.length / cols) * (cardH + gap));
      cards.forEach((c, idx) => {
        const col = idx % cols, row = Math.floor(idx / cols);
        const cx = marginX + col * (cardW + gap);
        const cy = y + row * (cardH + gap);
        doc.setFillColor(...C.chalk); doc.setDrawColor(...C.line); doc.setLineWidth(0.75);
        doc.roundedRect(cx, cy, cardW, cardH, 5, 5, "FD");
        doc.setFillColor(...C.lime);
        doc.rect(cx, cy, 3, cardH, "F");
        doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...C.muted);
        doc.text(c.label.toUpperCase(), cx + 12, cy + 14);
        doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...C.tealDark);
        doc.text(c.value, cx + 12, cy + 28, { maxWidth: cardW - 20 });
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...C.muted);
        doc.text(c.sub, cx + 12, cy + 39, { maxWidth: cardW - 20 });
      });
      y += Math.ceil(cards.length / cols) * (cardH + gap) + 8;
    };

    // ---- cover header band ----
    doc.setFillColor(...C.teal);
    doc.rect(0, 0, pageW, 112, "F");
    doc.setFillColor(...C.lime);
    doc.rect(0, 108, pageW, 4, "F");
    // logo lockup, top-left of the header band, on its own dark chip like the
    // site header — title/eyebrow text starts to the right of it.
    const logoW = 130, logoH = 31, logoChipW = logoW + 14;
    let textX = marginX;
    try {
      doc.setFillColor(...C.tealDark);
      doc.roundedRect(marginX, 20, logoChipW, logoH + 14, 5, 5, "F");
      doc.addImage(LOGO_SRC, "PNG", marginX + 7, 27, logoW, logoH);
      textX = marginX + logoChipW + 14;
    } catch (e) { /* logo is decorative — never block the export over it */ }
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...C.lime);
    doc.text("RHI-PSCC · TOURNAMENT RECORD", textX, 34);
    doc.setFont("helvetica", "bold"); doc.setFontSize(21); doc.setTextColor(...C.white);
    doc.text(eventName || "RHI-PSCC Group Tournament", textX, 65, { maxWidth: pageW - marginX - textX });
    doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(226, 230, 222);
    doc.text(`Exported ${new Date().toLocaleString()}`, textX, 88);
    y = 142;

    // ---- final standings ----
    sectionHeading("Final standings");
    subLine("Ties broken by point differential, shown in parentheses.");
    standings.forEach((row, i) => {
      ensureRoom(22);
      const chipColors = [C.lime, [214, 214, 200], [224, 196, 168]];
      doc.setFillColor(...(chipColors[i] || C.chalk));
      doc.circle(marginX + 8, y - 4, 8, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...C.charcoal);
      doc.text(String(i + 1), marginX + 8, y - 1, { align: "center" });

      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...C.charcoal);
      doc.text(groupLabelWithCaptain(row.group, byId), marginX + 24, y, { maxWidth: contentW - 190 });

      const diffStr = row.diff > 0 ? `+${row.diff}` : `${row.diff}`;
      doc.setFont("helvetica", "bold"); doc.setFontSize(10);
      doc.setTextColor(...(row.diff > 0 ? C.teal : row.diff < 0 ? C.loss : C.muted));
      doc.text(`${row.points} pt${row.points === 1 ? "" : "s"} (${diffStr})`, pageW - marginX - 84, y, { align: "right" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...C.muted);
      doc.text(`${row.played}/${row.total} played`, pageW - marginX, y, { align: "right" });

      y += 15;
      doc.setDrawColor(...C.line); doc.setLineWidth(0.5);
      doc.line(marginX, y, pageW - marginX, y);
      y += 11;
    });
    if (champion) {
      ensureRoom(30);
      doc.setFillColor(...C.teal);
      doc.roundedRect(marginX, y, contentW, 26, 5, 5, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...C.lime);
      const label = champion.tie ? `TIED FOR FIRST: ${champion.tie.map((g) => groupLabelWithCaptain(g, byId)).join(" & ")}` : `CHAMPION: ${groupLabelWithCaptain(champion, byId)}`;
      doc.text(label, pageW / 2, y + 17, { align: "center", maxWidth: contentW - 20 });
      y += 40;
    } else {
      y += 8;
    }

    // ---- groups & teams ----
    sectionHeading("Groups & teams");
    groups.forEach((g) => {
      ensureRoom(16);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...C.tealDark);
      doc.text(groupLabelWithCaptain(g, byId), marginX, y);
      y += 15;
      g.teams.forEach((t) => {
        ensureRoom(13);
        const desc = t.key === "Mixed" ? `${playerName(t.p1Id, byId)} (captain) & ${playerName(t.p2Id, byId)}` : teamLabelFromIds(t, byId);
        doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...C.muted);
        doc.text(t.label + ":", marginX + 12, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(...C.charcoal);
        doc.text(desc, marginX + 118, y, { maxWidth: contentW - 118 });
        y += 13;
      });
      y += 9;
    });

    // ---- full match log ----
    sectionHeading("Full match log");
    roundsWithCourts.forEach((r) => {
      ensureRoom(20);
      doc.setFillColor(...C.chalk);
      doc.rect(marginX, y - 10, contentW, 16, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...C.tealDark);
      doc.text(`ROUND ${r.roundNum}`, marginX + 6, y + 1);
      y += 17;
      r.matches.forEach((m) => {
        ensureRoom(14);
        const res = matchResult(m);
        const scoreStr = res.status === "done" ? `${res.scoreA}–${res.scoreB}` : res.status === "tie" ? `${res.scoreA}–${res.scoreB} T` : "—";
        const scoreColor = res.status === "done" ? C.teal : res.status === "tie" ? C.muted : C.line;
        doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...C.muted);
        doc.text(`Ct ${m.court} · ${m.category}`, marginX + 6, y);
        doc.setFontSize(9.5); doc.setTextColor(...C.charcoal);
        doc.text(`${sideLabel(m.teamA, byId)} vs ${sideLabel(m.teamB, byId)}`, marginX + 150, y, { maxWidth: contentW - 220 });
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...scoreColor);
        doc.text(scoreStr, pageW - marginX, y, { align: "right" });
        y += 14;
      });
      y += 8;
    });

    // ---- fun stats ----
    sectionHeading("Fun stats");
    const withGames = playerStats.filter((p) => p.played > 0);
    if (withGames.length === 0) {
      subLine("No results recorded yet.");
    } else {
      const sorted = [...withGames].sort((a, b) => b.winPct - a.winPct || b.wins - a.wins || b.played - a.played);
      const eligible = withGames.filter((p) => p.played >= 2);
      const pool = eligible.length > 0 ? eligible : withGames;
      const bestRecord = [...pool].sort((a, b) => b.winPct - a.winPct || b.wins - a.wins)[0];
      const mostWins = [...withGames].sort((a, b) => b.wins - a.wins)[0];
      const ironPlayer = [...withGames].sort((a, b) => b.played - a.played)[0];
      const woodenSpoon = [...withGames].sort((a, b) => b.losses - a.losses)[0];

      statCards([
        { label: "Best record", value: bestRecord.player.name, sub: `${bestRecord.wins}-${bestRecord.losses}${bestRecord.ties ? `-${bestRecord.ties}` : ""} (${Math.round(bestRecord.winPct * 100)}%)` },
        { label: "Most wins", value: mostWins.player.name, sub: `${mostWins.wins} win${mostWins.wins === 1 ? "" : "s"}` },
        { label: "Iron player", value: ironPlayer.player.name, sub: `${ironPlayer.played} match${ironPlayer.played === 1 ? "" : "es"} played` },
        { label: "Wooden spoon", value: woodenSpoon.player.name, sub: `${woodenSpoon.losses} loss${woodenSpoon.losses === 1 ? "" : "es"}` },
      ]);

      if (matchHighlights) {
        statCards([
          { label: "Biggest blowout", value: sideLabel(winnerSide(matchHighlights.blowout), byId), sub: `beat ${sideLabel(loserSide(matchHighlights.blowout), byId)} ${scoreLine(matchHighlights.blowout)} · ${matchHighlights.blowout.m.category}` },
          { label: "Nail-biter", value: sideLabel(winnerSide(matchHighlights.nailbiter), byId), sub: `edged ${sideLabel(loserSide(matchHighlights.nailbiter), byId)} ${scoreLine(matchHighlights.nailbiter)} · ${matchHighlights.nailbiter.m.category}` },
        ]);
      }

      ensureRoom(18);
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...C.tealDark);
      doc.text("PLAYER LEADERBOARD", marginX, y);
      y += 16;

      sorted.forEach((p, i) => {
        ensureRoom(18);
        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(...C.charcoal);
        doc.text(`${i + 1}. ${p.player.name}`, marginX, y);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...C.muted);
        doc.text(p.player.rank, marginX + 150, y);
        doc.setFont("helvetica", "bold"); doc.setFontSize(9);
        doc.setTextColor(...C.tealDark);
        doc.text(`${p.wins}-${p.losses}${p.ties ? `-${p.ties}` : ""}`, pageW - marginX - 55, y, { align: "right" });
        const diffStr = p.diff > 0 ? `+${p.diff}` : `${p.diff}`;
        doc.setTextColor(...(p.diff > 0 ? C.teal : p.diff < 0 ? C.loss : C.muted));
        doc.text(diffStr, pageW - marginX, y, { align: "right" });
        y += 13;
        doc.setDrawColor(...C.line); doc.setLineWidth(0.4);
        doc.line(marginX, y - 4, pageW - marginX, y - 4);
        y += 5;
      });
    }

    footer();

    const fname = `${(eventName || "tournament").replace(/[^a-z0-9]+/gi, "_")}.pdf`;
    doc.save(fname);
    showToast("PDF downloaded");
  };

  // ---- scoring ----
  const setScoreSide = (matchId, side, rawValue) => {
    const n = rawValue === "" ? null : Number(rawValue);
    const val = Number.isFinite(n) ? n : null;
    setMatchScores((prev) => {
      const existing = prev[matchId];
      const base = existing && typeof existing === "object" ? existing : { a: null, b: null };
      const nextEntry = { ...base, [side]: val };
      markPending("matchScores", matchId);
      patch({ matchScores: { [matchId]: nextEntry } }).finally(() => clearPending("matchScores", matchId));
      return { ...prev, [matchId]: nextEntry };
    });
  };

  const setCourtOverride = (matchId, courtNum) => {
    const next = { ...courtOverrides, [matchId]: courtNum };
    setCourtOverrides(next);
    markPending("courtOverrides", matchId);
    patch({ courtOverrides: { [matchId]: courtNum } }).finally(() => clearPending("courtOverrides", matchId));
  };

  // ---- round/court display with per-match court number (auto round-robin within
  // the round, overridable) ----
  const roundsWithCourts = useMemo(() => {
    return rounds.map((round, ri) => ({
      roundNum: ri + 1,
      matches: round.map((m, idx) => {
        const auto = (idx % courtCount) + 1;
        return { ...m, court: courtOverrides[m.id] || auto, autoCourt: auto };
      }),
    }));
  }, [rounds, courtCount, courtOverrides]);

  const timeEstimate = rounds.length * minutesPerMatch;

  // ---- find my match ----
  const findResults = useMemo(() => {
    const q = findQuery.trim().toLowerCase();
    if (q.length < 2) return [];
    const results = [];
    roundsWithCourts.forEach((r) => {
      r.matches.forEach((m) => {
        const names = [m.teamA.p1Id, m.teamA.p2Id, m.teamB.p1Id, m.teamB.p2Id].map((id) => playerName(id, byId).toLowerCase());
        if (names.some((n) => n.includes(q))) {
          const res = matchResult(m);
          results.push({ round: r.roundNum, m, res });
        }
      });
    });
    return results;
  }, [findQuery, roundsWithCourts, byId, matchScores]);

  const toggleGroupExpanded = (id) => {
    setExpandedGroupIds((prev) => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; });
  };

  if (firebaseConfigMissing) return <SetupScreen />;
  if (!loaded) return <div style={{ padding: 40, fontFamily: "Inter, sans-serif", color: "#6C7A76" }}>Loading…</div>;

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div style={styles.headerLine} />
        <div style={styles.headerRow}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0, flex: 1 }}>
            <div style={styles.logoBadge}>
              <img src={LOGO_SRC} alt="Robert Half · ATI" style={styles.logoImg} />
            </div>
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={styles.eyebrow}>{syncState === "live" ? "🟢 LIVE" : syncState === "error" ? "🔴 OFFLINE" : "🟡 CONNECTING"}</div>
              {isAdmin ? (
                <input value={eventName} onChange={(e) => setEventName(e.target.value)} onBlur={() => patch({ eventName })} style={styles.eventNameInput} />
              ) : (
                <h1 style={styles.h1}>{eventName}</h1>
              )}
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, flexShrink: 0 }}>
            <div style={styles.courtBadge}>{courtCount} COURTS · {groups.length} GROUPS</div>
            {isAdmin ? (
              <button style={styles.adminPillOn} onClick={lockAdmin}>Admin ✓ (tap to lock)</button>
            ) : (
              <button style={styles.adminPillOff} onClick={() => setPinOpen(!pinOpen)}>Admin sign-in</button>
              )}
          </div>
        </div>
        {pinOpen && !isAdmin && (
          <div style={styles.pinRow}>
            <input value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && !unlocking && tryUnlock()} placeholder="Enter admin password" type="password" autoComplete="current-password" disabled={unlocking} style={styles.pinInput} />
            <button style={styles.primaryBtn} onClick={tryUnlock} disabled={unlocking}>{unlocking ? "Checking…" : "Unlock"}</button>
          </div>
        )}
      </header>

      {!isAdmin && <div style={styles.viewBanner}>👀 View-only — updates from the organizer appear here automatically, no refresh needed.</div>}
      {syncState === "error" && <div style={styles.errorBanner}>⚠️ Not connected to the live database. Changes won't sync to other devices.</div>}

      <div style={styles.findBar}>
        <input value={findQuery} onChange={(e) => setFindQuery(e.target.value)} placeholder="🔎 Find your match — type your name" style={styles.findInput} />
        {findQuery.trim().length >= 2 && (
          <div style={styles.findResults}>
            {findResults.length === 0 && <div style={styles.findEmpty}>No match found yet for "{findQuery}"</div>}
            {findResults.map((r, i) => (
              <div key={i} style={styles.findCard}>
                <div style={styles.findStage}>Round {r.round} · {r.m.category}</div>
                <div style={styles.findLine}><strong>{teamLabelFromIds(r.m.teamA, byId)}</strong> vs {teamLabelFromIds(r.m.teamB, byId)}</div>
                <div style={styles.findMeta}>
                  <span style={styles.courtTag}>Court {r.m.court}</span>
                  <span style={styles.findStatus}>{r.res.status === "done" ? `Final ${r.res.scoreA}-${r.res.scoreB}` : r.res.status === "tie" ? "Tied — replay" : "Waiting"}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <nav style={styles.tabs}>
        {[
          { key: "roster", label: `Roster (${roster.length})` },
          { key: "groups", label: `Groups (${groups.length})` },
          { key: "schedule", label: "Schedule" },
          { key: "standings", label: "Standings" },
          { key: "funstats", label: "Fun Stats" },
        ].map((t) => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{ ...styles.tabBtn, ...(tab === t.key ? styles.tabBtnActive : {}) }}>{t.label}</button>
        ))}
      </nav>

      <main style={styles.main}>
        {tab === "roster" && (
          <RosterTab
            roster={roster} isAdmin={isAdmin} rosterCounts={rosterCounts}
            addPlayer={addPlayer} updatePlayer={updatePlayer} removePlayer={removePlayer}
            editingRoster={editingRoster} patch={patch}
            bulkOpen={bulkOpen} setBulkOpen={setBulkOpen} bulkText={bulkText} setBulkText={setBulkText} applyBulkRoster={applyBulkRoster}
            shuffleGroups={shuffleGroups} hasGroups={groups.length > 0} audit={assignmentAudit}
          />
        )}

        {tab === "groups" && (
          <GroupsTab
            groups={groups} roster={roster} byId={byId} isAdmin={isAdmin} audit={assignmentAudit}
            shuffleGroups={shuffleGroups} setTeamSlot={setTeamSlot} setCaptain={setCaptain}
            expandedGroupIds={expandedGroupIds} toggleGroupExpanded={toggleGroupExpanded}
            setTab={setTab}
          />
        )}

        {tab === "schedule" && (
          <ScheduleTab
            groups={groups} matches={matches} roundsWithCourts={roundsWithCourts} byId={byId} isAdmin={isAdmin}
            courtCount={courtCount} setCourtCount={(v) => { setCourtCount(v); patch({ courtCount: v }); }}
            minutesPerMatch={minutesPerMatch} setMinutesPerMatch={(v) => { setMinutesPerMatch(v); patch({ minutesPerMatch: v }); }}
            timeEstimate={timeEstimate} matchScores={matchScores} setScoreSide={setScoreSide}
            courtOverrides={courtOverrides} setCourtOverride={setCourtOverride} matchResult={matchResult}
          />
        )}

        {tab === "standings" && (
          <StandingsTab standings={standings} matches={matches} matchResult={matchResult} byId={byId} champion={champion} exportPdf={exportPdf} />
        )}

        {tab === "funstats" && (
          <FunStatsTab playerStats={playerStats} matchHighlights={matchHighlights} byId={byId} exportPdf={exportPdf} />
        )}
      </main>

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

// ============================ Roster tab ============================

function RosterTab({ roster, isAdmin, rosterCounts, addPlayer, updatePlayer, removePlayer, editingRoster, patch, bulkOpen, setBulkOpen, bulkText, setBulkText, applyBulkRoster, shuffleGroups, hasGroups, audit }) {
  const [newName, setNewName] = useState("");
  const [newRank, setNewRank] = useState("Intermediate");

  return (
    <section>
      <div style={styles.sectionHead}>
        <h2 style={styles.h2}>Roster</h2>
        {isAdmin && <button style={styles.linkBtn} onClick={() => setBulkOpen(!bulkOpen)}>{bulkOpen ? "Close paste box" : "Paste roster"}</button>}
      </div>
      <p style={styles.mutedSmall}>
        {rosterCounts.Expert} Expert{rosterCounts.Expert === 1 ? "" : "s"} (1 per group) · {rosterCounts.Intermediate} Intermediate · {rosterCounts.Novice} Novice
      </p>

      {isAdmin && bulkOpen && (
        <div style={styles.card}>
          <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} placeholder={"One player per line: Name, Rank\nAshwin, Expert\nAJ, Intermediate\nCarrie, Novice\n…"} rows={6} style={styles.textarea} />
          <button style={styles.primaryBtn} onClick={applyBulkRoster}>Add players</button>
        </div>
      )}

      {isAdmin && (
        <div style={styles.card}>
          <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Player name" style={{ ...styles.input, border: "1px solid #E4E0D2", borderRadius: 8, padding: "8px 10px", flex: 1 }} />
            <select value={newRank} onChange={(e) => setNewRank(e.target.value)} style={styles.rankSelect}>
              {RANKS.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
            <button style={styles.primaryBtn} onClick={() => { addPlayer(newName, newRank); setNewName(""); }}>Add</button>
          </div>
          <p style={styles.mutedSmall}>Use this for roster exceptions — a late signup, a no-show removal, or fixing someone's skill level.</p>
        </div>
      )}

      {(audit.unassigned.length > 0 || audit.doubled.length > 0 || audit.expertsNotCaptaining.length > 0 || audit.stale) && hasGroups && (
        <div style={styles.warnCard}>
          {audit.stale && <div>⚠️ Roster's Expert count no longer matches the number of groups built — reshuffle to pick up the change.</div>}
          {audit.expertsNotCaptaining.length > 0 && <div>⚠️ Not captaining a group: {audit.expertsNotCaptaining.map((p) => p.name).join(", ")}</div>}
          {audit.unassigned.length > 0 && <div>⚠️ Not assigned to any team: {audit.unassigned.map((p) => p.name).join(", ")}</div>}
          {audit.doubled.length > 0 && <div>⚠️ Assigned to more than one slot: {audit.doubled.map((p) => p.name).join(", ")}</div>}
        </div>
      )}

      <div style={styles.rosterList}>
        {roster.map((p) => (
          <div key={p.id} style={styles.rosterRow}>
            <input
              value={p.name} disabled={!isAdmin}
              onFocus={() => { editingRoster.current = true; }}
              onChange={(e) => updatePlayer(p.id, { name: e.target.value })}
              onBlur={() => { editingRoster.current = false; }}
              style={{ ...styles.input, ...(!isAdmin ? styles.inputDisabled : {}) }}
            />
            <select value={p.rank} disabled={!isAdmin} onChange={(e) => updatePlayer(p.id, { rank: e.target.value })} style={styles.rankSelect}>
              {RANKS.map((r) => <option key={r} value={r}>{r}</option>)}
            </select>
            {isAdmin && <button style={styles.removeBtn} onClick={() => removePlayer(p.id)}>✕</button>}
          </div>
        ))}
        {roster.length === 0 && <p style={styles.muted}>No players yet — paste a roster or add players above.</p>}
      </div>

      {isAdmin && roster.length > 0 && (
        <button style={styles.primaryBtnLg} onClick={shuffleGroups}>
          {hasGroups ? "Reshuffle groups →" : "Shuffle into groups →"}
        </button>
      )}
      {!isAdmin && <p style={styles.muted}>Sign in as admin to edit the roster or shuffle groups.</p>}
    </section>
  );
}

// ============================ Groups tab ============================

function GroupsTab({ groups, roster, byId, isAdmin, audit, shuffleGroups, setTeamSlot, setCaptain, expandedGroupIds, toggleGroupExpanded, setTab }) {
  const experts = roster.filter((p) => p.rank === "Expert");
  const intermediates = roster.filter((p) => p.rank === "Intermediate");
  const novices = roster.filter((p) => p.rank === "Novice");
  const poolFor = (category) => category === "Intermediate" ? intermediates : category === "Mixed" ? novices : category.startsWith("Novice") ? novices : [];

  return (
    <section>
      <div style={styles.sectionHead}>
        <h2 style={styles.h2}>Groups &amp; teams</h2>
        {isAdmin && groups.length > 0 && <button style={styles.linkBtn} onClick={shuffleGroups}>Reshuffle</button>}
      </div>
      {groups.length === 0 ? (
        <p style={styles.muted}>No groups yet — go to Roster and shuffle first.</p>
      ) : (
        <>
          <p style={styles.mutedSmall}>Every match is cross-group only — a group's own teams never play each other. {isAdmin ? "Use the dropdowns below to move anyone into a different slot after the shuffle." : "Tap a group to see its lineup."}</p>
          {groups.map((g) => {
            const isOpen = expandedGroupIds.has(g.id) || isAdmin;
            return (
              <div key={g.id} style={styles.groupCard}>
                <button style={styles.groupHead} onClick={() => toggleGroupExpanded(g.id)}>
                  <span style={{ ...styles.standChevron, ...(isOpen ? styles.standChevronOpen : {}) }}>▸</span>
                  <span style={styles.groupTitle}>{g.label}</span>
                  <span style={styles.groupCaptain}>Captain: {isAdmin ? (
                    <select value={g.captainId || ""} onClick={(e) => e.stopPropagation()} onChange={(e) => setCaptain(g.id, e.target.value)} style={styles.rankSelect}>
                      {experts.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                  ) : playerName(g.captainId, byId)}</span>
                </button>
                {isOpen && (
                  <div style={styles.groupBody}>
                    {g.teams.map((t) => {
                      const pool = poolFor(t.key.startsWith("Intermediate") ? "Intermediate" : t.key);
                      return (
                        <div key={t.id} style={styles.teamRowEdit}>
                          <span style={styles.teamCategoryTag}>{t.label}</span>
                          {isAdmin ? (
                            <div style={{ display: "flex", gap: 6, flex: 1, flexWrap: "wrap" }}>
                              {t.key === "Mixed" ? (
                                <span style={styles.fixedPlayer}>{playerName(t.p1Id, byId)} (captain)</span>
                              ) : (
                                <select value={t.p1Id || ""} onChange={(e) => setTeamSlot(g.id, t.id, "p1Id", e.target.value)} style={styles.rankSelect}>
                                  <option value="">— empty —</option>
                                  {pool.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                              )}
                              <select value={t.p2Id || ""} onChange={(e) => setTeamSlot(g.id, t.id, "p2Id", e.target.value)} style={styles.rankSelect}>
                                <option value="">— BYE PARTNER —</option>
                                {pool.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
                              </select>
                            </div>
                          ) : (
                            <span>{teamLabelFromIds(t, byId)}</span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          {(audit.unassigned.length > 0 || audit.doubled.length > 0) && (
            <p style={styles.warnLine}>⚠️ Some players aren't cleanly assigned — check the Roster tab for details.</p>
          )}
          <button style={styles.primaryBtnLg} onClick={() => setTab("schedule")}>{isAdmin ? "Build the schedule →" : "View the schedule →"}</button>
        </>
      )}
    </section>
  );
}

// ============================ Schedule tab ============================

function ScheduleTab({ groups, matches, roundsWithCourts, byId, isAdmin, courtCount, setCourtCount, minutesPerMatch, setMinutesPerMatch, timeEstimate, matchScores, setScoreSide, courtOverrides, setCourtOverride, matchResult }) {
  const [roundTab, setRoundTab] = useState(0);
  useEffect(() => { if (roundTab >= roundsWithCourts.length) setRoundTab(0); }, [roundsWithCourts.length]);

  if (groups.length === 0) return <section><p style={styles.muted}>Shuffle groups first.</p></section>;
  if (matches.length === 0) return <section><p style={styles.muted}>Need at least 2 groups before any cross-group matches exist.</p></section>;

  const maxConcurrentExpertMatches = Math.floor(groups.length / 2);
  const active = roundsWithCourts[roundTab] || { matches: [] };

  return (
    <section>
      <div style={styles.formatNote}>
        All {matches.length} matches are round-robin, cross-group only — enter scores in any order. With {groups.length} group{groups.length === 1 ? "" : "s"} captaining Experts, at most {maxConcurrentExpertMatches || 1} Expert-involving match{maxConcurrentExpertMatches === 1 ? "" : "es"} can run at once, which sets the schedule's real floor regardless of court count.
      </div>

      {isAdmin && (
        <div style={styles.timeCard}>
          <div style={styles.timeRow}>
            <span>Number of courts</span>
            <div style={styles.stepper}>
              <button style={styles.stepperBtn} onClick={() => setCourtCount(Math.max(1, courtCount - 1))}>−</button>
              <input type="number" min={1} max={12} value={courtCount} onChange={(e) => setCourtCount(Math.max(1, Math.min(12, Number(e.target.value) || 1)))} style={styles.stepperInput} />
              <button style={styles.stepperBtn} onClick={() => setCourtCount(Math.min(12, courtCount + 1))}>+</button>
            </div>
          </div>
          <div style={styles.timeRow}>
            <span>Minutes per match</span>
            <input type="number" min={5} max={60} value={minutesPerMatch} onChange={(e) => setMinutesPerMatch(Number(e.target.value) || 15)} style={styles.miniInput} />
          </div>
          <div style={styles.timeRow}>
            <span>{roundsWithCourts.length} rounds · est. total time</span>
            <strong style={{ color: "#0F5257" }}>{Math.round(timeEstimate / 60 * 10) / 10}h ({timeEstimate}m)</strong>
          </div>
        </div>
      )}

      <div style={styles.roundTabs}>
        {roundsWithCourts.map((r, i) => (
          <button key={i} onClick={() => setRoundTab(i)} style={{ ...styles.roundTabBtn, ...(roundTab === i ? styles.roundTabBtnActive : {}) }}>Round {r.roundNum}</button>
        ))}
      </div>

      <div style={styles.matchList}>
        {active.matches.map((m) => {
          const res = matchResult(m);
          const existing = matchScores[m.id];
          const struct = existing && typeof existing === "object" ? existing : { a: null, b: null };
          return (
            <div key={m.id} style={styles.matchCard}>
              <div style={styles.matchMeta}>
                <span style={styles.courtTag}>Court {m.court}</span>
                <span style={styles.categoryTag}>{m.category}</span>
                {isAdmin && (
                  <select value={courtOverrides[m.id] || ""} onChange={(e) => setCourtOverride(m.id, e.target.value ? Number(e.target.value) : null)} style={styles.courtSelect}>
                    <option value="">Auto (Court {m.autoCourt})</option>
                    {Array.from({ length: courtCount }, (_, i) => i + 1).map((c) => <option key={c} value={c}>Move to Court {c}</option>)}
                  </select>
                )}
              </div>
              <div style={styles.matchTeams}>
                {[{ side: "a", team: m.teamA, group: m.groupA }, { side: "b", team: m.teamB, group: m.groupB }].map(({ side, team, group }) => {
                  const isWinner = res.status === "done" && res.winnerGroupId === group.id;
                  return (
                    <div key={side} style={styles.teamScoreRow}>
                      <div style={{ ...styles.sideBtn, ...(isWinner ? styles.sideBtnWin : {}) }}>
                        {isWinner && <span style={styles.trophyMark}>🏆 </span>}
                        <div>{team.category === "Singles" ? playerName(team.p1Id, byId) : teamLabelFromIds(team, byId)}</div>
                        <div style={styles.groupSubLabel}>{groupLabelWithCaptain(group, byId)}</div>
                      </div>
                      {isAdmin ? (
                        <input
                          key={m.id + "_" + side + "_" + (struct[side] ?? "")}
                          type="number" min={0} max={99} defaultValue={struct[side] ?? ""} placeholder="pts"
                          onBlur={(e) => setScoreSide(m.id, side, e.target.value)}
                          style={styles.scoreInputInline}
                        />
                      ) : (
                        Number.isFinite(struct[side]) && <div style={styles.scoreDisplayInline}>{struct[side]}</div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div style={styles.winnerNote}>
                {res.status === "done" ? "Winner set automatically from the score — edit either score to change it"
                  : res.status === "tie" ? "Tied — replay to settle this one"
                  : isAdmin ? "Enter both scores" : "Result pending"}
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

function StandingsTab({ standings, matches, matchResult, byId, champion, exportPdf }) {
  return (
    <section>
      <div style={styles.sectionHead}>

      </div>
      {standings.length === 0 ? <p style={styles.muted}>Shuffle groups first.</p> : (
        <>
          <p style={styles.mutedSmall}>1 point per match win across every category, all weighted equally. A tied score counts as played but awards no point to either side — replay it. Ties in points are broken by total point differential (shown in parentheses, like a net rating) — the group that outscored its opponents by more comes out ahead.</p>
          <div style={styles.standingsList}>
            {standings.map((row, i) => (
              <div key={row.group.id} style={styles.standCard}>
                <div style={styles.standRowStatic}>
                  <span style={styles.rankNum}>{i + 1}</span>
                  <span style={styles.standName}>{groupLabelWithCaptain(row.group, byId)}</span>
                  <span style={styles.recordText}>{row.points} pt{row.points === 1 ? "" : "s"}</span>
                  <span style={{ ...styles.diffScoreText, color: row.diff > 0 ? "#0F5257" : row.diff < 0 ? "#B4483A" : "#6C7A76" }}>{row.diff > 0 ? `+${row.diff}` : row.diff}</span>
                  <span style={styles.diffText}>{row.played}/{row.total} played</span>
                </div>
              </div>

          </div>
          {champion && !champion.tie && matches.length > 0 && (

          )}
        </>
      )}
    </section>
  );
}

// Personal bar-talk stats — best record, most wins, iron player, wooden
// spoon, plus the tournament's biggest blowout and closest match. All
// derived from the same matches/scores everyone already sees; nothing new
// to enter.

function FunStatsTab({ playerStats, matchHighlights, byId, exportPdf }) {
  const withGames = playerStats.filter((p) => p.played > 0);

  return (
    <section>
      <div style={styles.sectionHead}>
        <h2 style={styles.h2}>Fun Stats</h2>
        {withGames.length > 0 && <button style={styles.linkBtn} onClick={exportPdf}>📄 Export PDF</button>}
      </div>
      {withGames.length === 0 ? (
        <p style={styles.muted}>Stats show up here once a few matches have scores — check back once the schedule gets going.</p>
      ) : (
        <FunStatsBody withGames={withGames} matchHighlights={matchHighlights} byId={byId} />
      )}
    </section>
  );
}

function FunStatsBody({ withGames, matchHighlights, byId }) {
  const eligible = withGames.filter((p) => p.played >= 2);
  const pool = eligible.length > 0 ? eligible : withGames;
  const bestRecord = [...pool].sort((a, b) => b.winPct - a.winPct || b.wins - a.wins)[0];
  const mostWins = [...withGames].sort((a, b) => b.wins - a.wins)[0];
  const ironPlayer = [...withGames].sort((a, b) => b.played - a.played)[0];
  const woodenSpoon = [...withGames].sort((a, b) => b.losses - a.losses)[0];
  const undefeated = withGames.filter((p) => p.wins > 0 && p.losses === 0 && p.ties === 0);
  const sorted = [...withGames].sort((a, b) => b.winPct - a.winPct || b.wins - a.wins || b.played - a.played);

  return (
    <>
      <p style={styles.mutedSmall}>Every player's personal record across all their matches — doubles partners share a result, so a team win counts for both players (a captain's Mixed-team result and Singles result both count toward their own line). Just for fun, not part of the standings.</p>

      <div style={styles.statGrid}>
        <div style={styles.statCard}>
          <div style={styles.statLabel}>🏆 Best record</div>
          <div style={styles.statValue}>{bestRecord.player.name}</div>
          <div style={styles.statSub}>{bestRecord.wins}-{bestRecord.losses}{bestRecord.ties ? `-${bestRecord.ties}` : ""} ({Math.round(bestRecord.winPct * 100)}%)</div>
        </div>
        <div style={styles.statCard}>
          <div style={styles.statLabel}>🔥 Most wins</div>
          <div style={styles.statValue}>{mostWins.player.name}</div>
          <div style={styles.statSub}>{mostWins.wins} win{mostWins.wins === 1 ? "" : "s"}</div>
        </div>
        <div style={styles.statCard}>
          <div style={styles.statLabel}>💪 Iron player</div>
          <div style={styles.statValue}>{ironPlayer.player.name}</div>
          <div style={styles.statSub}>{ironPlayer.played} match{ironPlayer.played === 1 ? "" : "es"} played</div>
        </div>
        <div style={styles.statCard}>
          <div style={styles.statLabel}>🥄 Wooden spoon</div>
          <div style={styles.statValue}>{woodenSpoon.player.name}</div>
          <div style={styles.statSub}>{woodenSpoon.losses} loss{woodenSpoon.losses === 1 ? "" : "es"}</div>
        </div>
      </div>

      {undefeated.length > 0 && (
        <p style={styles.mutedSmall}>🎯 Still undefeated: {undefeated.map((p) => p.player.name).join(", ")}</p>
      )}

      {matchHighlights && (
        <div style={styles.statGrid}>
          <div style={styles.statCard}>
            <div style={styles.statLabel}>💥 Biggest blowout</div>
            <div style={styles.statValue}>{sideLabel(winnerSide(matchHighlights.blowout), byId)}</div>
            <div style={styles.statSub}>beat {sideLabel(loserSide(matchHighlights.blowout), byId)} {scoreLine(matchHighlights.blowout)} · {matchHighlights.blowout.m.category}</div>
          </div>
          <div style={styles.statCard}>
            <div style={styles.statLabel}>😅 Nail-biter</div>
            <div style={styles.statValue}>{sideLabel(winnerSide(matchHighlights.nailbiter), byId)}</div>
            <div style={styles.statSub}>edged {sideLabel(loserSide(matchHighlights.nailbiter), byId)} {scoreLine(matchHighlights.nailbiter)} · {matchHighlights.nailbiter.m.category}</div>
          </div>
        </div>
      )}

      <div style={styles.standingsList}>
        {sorted.map((p) => (
          <div key={p.player.id} style={styles.standCard}>
            <div style={styles.statRow}>
              <span style={styles.standName}>{p.player.name}</span>
              <span style={styles.statRankTag}>{p.player.rank}</span>
              <span style={styles.recordText}>{p.wins}-{p.losses}{p.ties ? `-${p.ties}` : ""}</span>
              <span style={{ ...styles.diffScoreText, color: p.diff > 0 ? "#0F5257" : p.diff < 0 ? "#B4483A" : "#6C7A76" }}>{p.diff > 0 ? `+${p.diff}` : p.diff}</span>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}
